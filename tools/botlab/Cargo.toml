[package]
name = "botlab"
version = "0.1.0"
edition = "2021"
description = "Hjerterfri bots for tuning: engine, the three levels and the bot tournament. Ruby (app/models/hjerterfri) mirrors these bots for production."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
