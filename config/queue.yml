default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # Bots answer at once and each bot move is its own job, so a worker
      # that polls every second would make each move wait up to a second.
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
