      game_not_available: Det spil kommer snart.
      not_friend: Du kan kun puffe dine venner.
      already_seated: Din ven sidder allerede ved bordet.
      already_nudged: Din ven har allerede fået et puf til bordet.
      nudge_cap: Der er ikke flere ledige pladser at puffe til.
